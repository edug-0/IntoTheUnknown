name: Build deployment image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed main commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      REGISTRY: acrplanetxitu7q4.azurecr.io
    steps:
      - name: Validate source SHA
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        shell: bash
        run: git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Image name
        id: image
        shell: bash
        run: echo "tag=$REGISTRY/spherex-blink:${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: acrplanetxitu7q4.azurecr.io
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ secrets.ACR_BUILD_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
